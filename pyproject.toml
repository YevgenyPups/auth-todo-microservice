[project]
name = "auth-todo-microservice"
version = "0.1.0"
description = "Auth service as a part of TODO app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.120.0",
    "gunicorn==23.0.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.11.0",
    "pydantic-settings==2.8.1",
    "email-validator==2.2.0",
    "sqlalchemy==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "greenlet>=2.0.0",
    "psycopg2-binary==2.9.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
